<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Māori Culture — Picture Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    html, body, #root { width: 100%; height: 100%; }
    body { overflow: hidden; }

    @keyframes flip-forward {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-180deg); }
    }
    @keyframes flip-backward {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(180deg); }
    }
    @keyframes pop {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes pulse-mini {
      0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(212,162,76, 0.6); }
      50%      { transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 0 0 12px rgba(212,162,76, 0); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50%      { transform: rotate(3deg) translateY(-4px); }
    }

    .wave-bar {
      display:inline-block; width:3px;
      background: currentColor; border-radius:2px;
      animation: wave 0.7s infinite ease-in-out alternate;
      margin-right:2px;
    }
    @keyframes wave {
      from { transform: scaleY(0.4); }
      to   { transform: scaleY(1); }
    }

    button:disabled { cursor: not-allowed; }
  </style>

  <template id="__bundler_thumbnail" data-bg-color="#3D2E22">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <!-- Open book silhouette in warm tan, against the brown bg -->
      <g transform="translate(600 400)">
        <!-- left page -->
        <rect x="-260" y="-180" width="260" height="360" rx="10" fill="#FBF6EC"/>
        <!-- right page -->
        <rect x="0" y="-180" width="260" height="360" rx="10" fill="#FBF6EC"/>
        <!-- spine shadow -->
        <rect x="-6" y="-180" width="12" height="360" fill="#3D2E22" opacity="0.35"/>
        <!-- left page lines -->
        <rect x="-220" y="-110" width="180" height="14" rx="4" fill="#B5341C"/>
        <rect x="-220" y="-78"  width="120" height="8"  rx="3" fill="#2A1F1A" opacity="0.5"/>
        <rect x="-220" y="-58"  width="160" height="8"  rx="3" fill="#2A1F1A" opacity="0.3"/>
        <!-- right page koru dot -->
        <circle cx="130" cy="-30" r="42" fill="#D4A24C"/>
        <circle cx="130" cy="-30" r="16" fill="#3D2E22"/>
        <!-- right page lines -->
        <rect x="40" y="80" width="180" height="10" rx="3" fill="#2A1F1A" opacity="0.4"/>
        <rect x="40" y="105" width="140" height="10" rx="3" fill="#2A1F1A" opacity="0.25"/>
      </g>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="sb-spreads.jsx"></script>
  <script type="text/babel" src="sb-app.jsx"></script>
</body>
</html>
