name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  wip-check:
    name: WIP Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Block WIP pull requests
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qi '\bWIP\b'; then
            echo "::error::PR title contains 'WIP' — remove it from the title before merging."
            exit 1
          fi
          echo "✅ No WIP found in PR title."

  check:
    name: TypeScript & Svelte Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run type check
        run: npm run check

      - name: Build
        run: npm run build
