<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Māori Culture — Map Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    html, body, #root { width: 100%; height: 100%; }
    body { overflow: hidden; }

    @keyframes pulse-ring {
      0%   { transform: translate(-50%, 0) scale(1);   opacity: 0.7; }
      100% { transform: translate(-50%, 0) scale(1.6); opacity: 0;   }
    }
    @keyframes pop {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes bob {
      from { transform: translate(-50%, -85%); }
      to   { transform: translate(-50%, -88%); }
    }
    /* No animation — html-to-image freezes animations at first frame, leaving the
       panel off-screen in screenshots. Pop-in instead. */
    .panel-in {}
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .wave-bar {
      display: inline-block;
      width: 3px;
      background: currentColor;
      border-radius: 2px;
      animation: wave 0.7s infinite ease-in-out alternate;
      margin-right: 2px;
    }
    @keyframes wave {
      from { transform: scaleY(0.4); }
      to   { transform: scaleY(1); }
    }

    button:disabled { cursor: not-allowed; }

    /* Celebration burst — petals fly out from a centre point */
    @keyframes petal-fly {
      0%   { transform: translate(-50%, -50%) scale(0) rotate(0); opacity: 0; }
      15%  { transform: translate(-50%, -50%) scale(1) rotate(20deg); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.6) rotate(180deg); opacity: 0; }
    }
    @keyframes badge-bounce {
      0%   { transform: scale(0) rotate(-30deg); }
      60%  { transform: scale(1.15) rotate(8deg); }
      100% { transform: scale(1) rotate(0); }
    }
    /* Character dances briefly */
    @keyframes tamariki-dance {
      0%, 100% { transform: translate(-50%, -85%) rotate(0deg); }
      20%      { transform: translate(-50%, -92%) rotate(-8deg); }
      40%      { transform: translate(-50%, -85%) rotate(0deg); }
      60%      { transform: translate(-50%, -92%) rotate(8deg); }
      80%      { transform: translate(-50%, -85%) rotate(0deg); }
    }
    /* Subtle pulse for grey hotspots — invites interaction */
    @keyframes hotspot-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4), var(--shadow-warm); }
      50%      { box-shadow: 0 0 0 12px rgba(255,255,255,0), var(--shadow-warm); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="me-modules.jsx"></script>
  <script type="text/babel" src="me-app.jsx"></script>
</body>
</html>
